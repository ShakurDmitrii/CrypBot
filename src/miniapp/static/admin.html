<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>РќР•Р‘Рћ вЂў РћРєРЅРѕ РѕРїРµСЂР°С‚РѕСЂР°</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #071a22;
        --panel: #0d2733;
        --line: #1e4658;
        --line-soft: #1a3e4f;
        --text: #eaf8f7;
        --soft: #9ec1c8;
        --accent: #2ec9b8;
        --accent-2: #1f8db6;
        --warn: #ff9f9f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Manrope", "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(160deg, #0d2b38, var(--bg));
        color: var(--text);
      }

      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px;
      }

      .header {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--panel);
      }

      .title {
        margin: 0;
        font-size: 24px;
      }

      .meta {
        margin-top: 6px;
        color: var(--soft);
        font-size: 13px;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #103341;
        color: var(--text);
        padding: 9px 12px;
        font: inherit;
        cursor: pointer;
      }

      .btn.primary {
        background: linear-gradient(160deg, #1ba595, #1a7cab);
      }

      .btn.danger {
        background: linear-gradient(160deg, #8a2c2c, #b23a3a);
      }

      .btn.active {
        border-color: #5ce3d3;
        box-shadow: inset 0 0 0 1px rgba(92, 227, 211, 0.35);
      }

      .panel {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(7, 25, 33, 0.95);
        padding: 12px;
      }

      .status {
        color: var(--soft);
        font-size: 14px;
      }

      .status.err {
        color: var(--warn);
      }

      .tools {
        margin-top: 10px;
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr;
      }

      .search-row {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr auto;
      }

      .input,
      .select {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0b2b38;
        color: var(--text);
        padding: 9px 10px;
        font: inherit;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(14, 42, 54, 0.8);
        color: var(--text);
        padding: 6px 10px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .chip.active {
        border-color: #5ce3d3;
        background: rgba(28, 88, 96, 0.92);
      }

      .table-wrap {
        overflow: auto;
        margin-top: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 780px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        font-size: 13px;
        vertical-align: top;
      }

      th {
        color: var(--soft);
        font-weight: 600;
      }

      .request-row {
        cursor: pointer;
        transition: background 0.12s ease;
      }

      .request-row:hover {
        background: rgba(48, 117, 145, 0.22);
      }

      .request-row.selected {
        background: rgba(46, 201, 184, 0.2);
      }

      .request-editor {
        margin-top: 12px;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        background: rgba(9, 31, 40, 0.9);
        padding: 10px;
      }

      .request-editor.hidden {
        display: none;
      }

      .editor-head {
        font-size: 14px;
        color: var(--soft);
      }

      .editor-grid {
        margin-top: 8px;
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }

      .editor-actions {
        margin-top: 8px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .status-pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
      }

      .muted {
        color: var(--soft);
      }

      .chat-workspace {
        margin-top: 10px;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        padding: 10px;
        background: rgba(8, 29, 38, 0.9);
      }

      .chat-workspace.hidden {
        display: none;
      }

      .chat-layout {
        display: grid;
        gap: 10px;
        grid-template-columns: 320px 1fr;
      }

      .chat-users,
      .chat-dialog {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: rgba(7, 24, 32, 0.92);
        padding: 8px;
      }

      .chat-users-list {
        display: grid;
        gap: 6px;
        max-height: 440px;
        overflow-y: auto;
      }

      .chat-user-btn {
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: rgba(12, 37, 48, 0.8);
        color: var(--text);
        text-align: left;
        padding: 8px;
        cursor: pointer;
      }

      .chat-user-btn.active {
        border-color: #5ce3d3;
        background: rgba(26, 82, 92, 0.9);
      }

      .chat-user-meta {
        color: var(--soft);
        font-size: 12px;
        margin-top: 3px;
      }

      .chat-dialog-title {
        color: var(--soft);
        font-size: 14px;
      }

      .chat-messages {
        margin-top: 8px;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: rgba(6, 22, 30, 0.86);
        min-height: 280px;
        max-height: 360px;
        overflow-y: auto;
        padding: 8px;
        display: grid;
        gap: 8px;
      }

      .chat-msg-row {
        display: flex;
      }

      .chat-msg-row.mine {
        justify-content: flex-end;
      }

      .chat-msg {
        max-width: 86%;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        padding: 7px 9px;
        background: rgba(11, 38, 52, 0.9);
      }

      .chat-msg-row.mine .chat-msg {
        background: rgba(28, 100, 98, 0.92);
        border-color: rgba(92, 227, 211, 0.45);
      }

      .chat-msg-text {
        white-space: pre-wrap;
        line-height: 1.35;
        font-size: 14px;
      }

      .chat-msg-time {
        margin-top: 4px;
        font-size: 11px;
        color: var(--soft);
      }

      .chat-compose {
        margin-top: 8px;
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr auto;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .search-row {
          grid-template-columns: 1fr;
        }

        .editor-grid {
          grid-template-columns: 1fr;
        }

        .chat-layout {
          grid-template-columns: 1fr;
        }

        .chat-compose {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="header">
        <h1 class="title">РћРєРЅРѕ РѕРїРµСЂР°С‚РѕСЂР°</h1>
        <div class="meta" id="meta">РџСЂРѕРІРµСЂРєР° РґРѕСЃС‚СѓРїР°...</div>
        <div class="toolbar">
          <button class="btn primary active" id="loadRequestsBtn" type="button">Р—Р°СЏРІРєРё</button>
          <button class="btn primary" id="loadUsersBtn" type="button">РџРѕР»СЊР·РѕРІР°С‚РµР»Рё</button>
          <button class="btn primary" id="loadHistoryBtn" type="button">РСЃС‚РѕСЂРёСЏ СЃС‚Р°С‚СѓСЃРѕРІ</button>
          <button class="btn primary" id="loadChatBtn" type="button">Р§Р°С‚</button>
          <button class="btn primary" id="loadSettingsBtn" type="button">РќР°СЃС‚СЂРѕР№РєРё</button>
          <button class="btn" id="backBtn" type="button">РќР° РіР»Р°РІРЅСѓСЋ РјРёРЅРёР°РїРїСѓ</button>
        </div>
      </section>

      <section class="panel">
        <div class="status" id="status">РћР¶РёРґР°РЅРёРµ...</div>
        <div class="tools" id="contextTools"></div>
        <div class="table-wrap" id="tableWrap"></div>

        <div class="request-editor hidden" id="requestEditorWrap">
          <div class="editor-head" id="editorHead">Р’С‹Р±РµСЂРёС‚Рµ Р·Р°СЏРІРєСѓ РІ С‚Р°Р±Р»РёС†Рµ</div>
          <div class="editor-grid">
            <select class="select" id="editorStatus"></select>
            <input
              class="input"
              id="editorComment"
              type="text"
              maxlength="512"
              placeholder="РљРѕРјРјРµРЅС‚Р°СЂРёР№ Рє СЃС‚Р°С‚СѓСЃСѓ (РѕРїС†РёРѕРЅР°Р»СЊРЅРѕ)"
            />
          </div>
          <div class="editor-actions">
            <button class="btn primary" id="applyStatusBtn" type="button">РЎРѕС…СЂР°РЅРёС‚СЊ СЃС‚Р°С‚СѓСЃ</button>
            <button class="btn danger" id="deleteRequestBtn" type="button">РЈРґР°Р»РёС‚СЊ Р·Р°СЏРІРєСѓ</button>
          </div>
        </div>

        <div class="chat-workspace hidden" id="chatWorkspace">
          <div class="chat-layout">
            <div class="chat-users">
              <div class="chat-dialog-title">Р”РёР°Р»РѕРіРё</div>
              <div class="chat-users-list" id="adminChatUsersList"></div>
            </div>
            <div class="chat-dialog">
              <div class="chat-dialog-title" id="adminChatTitle">Р’С‹Р±РµСЂРёС‚Рµ РїРѕР»СЊР·РѕРІР°С‚РµР»СЏ СЃР»РµРІР°</div>
              <div class="chat-messages" id="adminChatMessages"></div>
              <div class="chat-compose">
                <input class="input" id="adminChatInput" type="text" maxlength="2000" placeholder="РЎРѕРѕР±С‰РµРЅРёРµ РїРѕР»СЊР·РѕРІР°С‚РµР»СЋ..." />
                <button class="btn primary" id="adminChatSendBtn" type="button">РћС‚РїСЂР°РІРёС‚СЊ</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const REQUEST_STATUSES = [
        "new",
        "waiting_payment",
        "payment_received",
        "processing",
        "done",
        "canceled",
        "disputed",
      ];

      const STATUS_LABELS = {
        all: "Р’СЃРµ",
        new: "РќРѕРІР°СЏ",
        waiting_payment: "РћР¶РёРґР°РµС‚ РѕРїР»Р°С‚Сѓ",
        payment_received: "РћРїР»Р°С‚Р° РїРѕР»СѓС‡РµРЅР°",
        processing: "Р’ РѕР±СЂР°Р±РѕС‚РєРµ",
        done: "Р—Р°РІРµСЂС€РµРЅР°",
        canceled: "РћС‚РјРµРЅРµРЅР°",
        disputed: "РЎРїРѕСЂ",
      };

      function localizeAdminStaticTexts() {
        const setText = (selector, text) => {
          const node = document.querySelector(selector);
          if (node) {
            node.textContent = text;
          }
        };
        setText(".title", "РћРєРЅРѕ РѕРїРµСЂР°С‚РѕСЂР°");
        setText("#loadRequestsBtn", "Р—Р°СЏРІРєРё");
        setText("#loadUsersBtn", "РџРѕР»СЊР·РѕРІР°С‚РµР»Рё");
        setText("#loadHistoryBtn", "РСЃС‚РѕСЂРёСЏ СЃС‚Р°С‚СѓСЃРѕРІ");
        setText("#loadChatBtn", "Р§Р°С‚");
        setText("#loadSettingsBtn", "РќР°СЃС‚СЂРѕР№РєРё");
        setText("#backBtn", "РќР° РіР»Р°РІРЅСѓСЋ РјРёРЅРёР°РїРїСѓ");
      }

      function parseTelegramIdFromQuery() {
        const p = new URLSearchParams(window.location.search);
        const raw = p.get("telegram_id");
        if (!raw) {
          return null;
        }
        const id = Number(raw);
        return Number.isInteger(id) && id > 0 ? id : null;
      }

      function getTelegramId() {
        const fromTg = tg?.initDataUnsafe?.user?.id ?? null;
        if (fromTg) {
          return fromTg;
        }
        const fromQuery = parseTelegramIdFromQuery();
        if (fromQuery) {
          return fromQuery;
        }
        const raw = prompt("Р’РІРµРґРёС‚Рµ Telegram ID РѕРїРµСЂР°С‚РѕСЂР°");
        if (!raw) {
          return null;
        }
        const id = Number(raw);
        return Number.isInteger(id) && id > 0 ? id : null;
      }

      const state = {
        telegramId: getTelegramId(),
        accessGranted: false,
        view: "requests",
        selectedRequestId: null,
        requestStatusFilter: "all",
        requestSearch: "",
        requests: [],
        chatUsers: [],
        selectedChatUserId: null,
        chatMessages: [],
        chatPollTimer: null,
        appSettings: null,
      };

      const metaEl = document.getElementById("meta");
      const statusEl = document.getElementById("status");
      const contextToolsEl = document.getElementById("contextTools");
      const tableWrap = document.getElementById("tableWrap");
      const requestEditorWrap = document.getElementById("requestEditorWrap");
      const editorHead = document.getElementById("editorHead");
      const editorStatus = document.getElementById("editorStatus");
      const editorComment = document.getElementById("editorComment");
      const chatWorkspace = document.getElementById("chatWorkspace");
      const adminChatUsersList = document.getElementById("adminChatUsersList");
      const adminChatMessages = document.getElementById("adminChatMessages");
      const adminChatTitle = document.getElementById("adminChatTitle");
      const adminChatInput = document.getElementById("adminChatInput");
      const adminChatSendBtn = document.getElementById("adminChatSendBtn");

      REQUEST_STATUSES.forEach((status) => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = STATUS_LABELS[status] || status;
        editorStatus.appendChild(option);
      });

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.className = `status${isError ? " err" : ""}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function normalizeUsername(username) {
        const clean = String(username || "").trim();
        if (!clean) {
          return "-";
        }
        return clean.startsWith("@") ? clean : `@${clean}`;
      }

      function formatDate(value) {
        if (!value) {
          return "-";
        }
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) {
          return String(value);
        }
        return d.toLocaleString("ru-RU");
      }

      function formatAmount(value, digits = 2) {
        const num = Number(value);
        if (!Number.isFinite(num)) {
          return "-";
        }
        return num.toLocaleString("ru-RU", {
          minimumFractionDigits: 0,
          maximumFractionDigits: digits,
        });
      }

      function formatChatDate(value) {
        if (!value) {
          return "";
        }
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) {
          return "";
        }
        return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          return {};
        }
        return response.json();
      }

      function setActiveViewButton() {
        document.getElementById("loadRequestsBtn").classList.toggle("active", state.view === "requests");
        document.getElementById("loadUsersBtn").classList.toggle("active", state.view === "users");
        document.getElementById("loadHistoryBtn").classList.toggle("active", state.view === "history");
        document.getElementById("loadChatBtn").classList.toggle("active", state.view === "chat");
        document.getElementById("loadSettingsBtn").classList.toggle("active", state.view === "settings");
      }

      function setView(view) {
        state.view = view;
        setActiveViewButton();
        chatWorkspace.classList.toggle("hidden", view !== "chat");
        contextToolsEl.classList.toggle("hidden", view === "chat");
        tableWrap.classList.toggle("hidden", view === "chat");
        if (view !== "requests") {
          state.selectedRequestId = null;
          requestEditorWrap.classList.add("hidden");
        }
        if (view === "settings") {
          requestEditorWrap.classList.add("hidden");
          tableWrap.classList.add("hidden");
          contextToolsEl.classList.remove("hidden");
        }
        if (view !== "chat") {
          stopAdminChatPolling();
        }
      }

      async function checkAccess() {
        if (!state.telegramId) {
          metaEl.textContent = "РќРµ СѓРґР°Р»РѕСЃСЊ РѕРїСЂРµРґРµР»РёС‚СЊ Telegram ID.";
          setStatus("Р”РѕСЃС‚СѓРї РЅРµ РїСЂРµРґРѕСЃС‚Р°РІР»РµРЅ.", true);
          return;
        }
        try {
          const data = await api(`/api/me/${state.telegramId}`);
          if (!data.is_operator) {
            metaEl.textContent = `Telegram ID: ${state.telegramId}`;
            setStatus("Р”РѕСЃС‚СѓРї Р·Р°РїСЂРµС‰РµРЅ: РІС‹ РЅРµ РѕРїРµСЂР°С‚РѕСЂ.", true);
            return;
          }
          state.accessGranted = true;
          metaEl.textContent = `Telegram ID: ${state.telegramId} вЂў Р РѕР»СЊ: РѕРїРµСЂР°С‚РѕСЂ`;
          setStatus("Р”РѕСЃС‚СѓРї РїРѕРґС‚РІРµСЂР¶РґРµРЅ.");
        } catch (e) {
          setStatus(`РћС€РёР±РєР° РїСЂРѕРІРµСЂРєРё РґРѕСЃС‚СѓРїР°: ${e.message}`, true);
        }
      }

      function renderTable(headers, rows) {
        if (!rows.length) {
          tableWrap.innerHTML = "<div class='status'>РќРµС‚ РґР°РЅРЅС‹С….</div>";
          return;
        }
        const thead = `<thead><tr>${headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>`;
        const tbody = `<tbody>${rows
          .map((row) => `<tr>${row.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`)
          .join("")}</tbody>`;
        tableWrap.innerHTML = `<table>${thead}${tbody}</table>`;
      }

      function buildRequestCounters(items) {
        const counts = { all: items.length };
        REQUEST_STATUSES.forEach((s) => {
          counts[s] = items.filter((item) => item.status === s).length;
        });
        return counts;
      }

      function renderRequestTools(items) {
        const counters = buildRequestCounters(items);
        contextToolsEl.innerHTML = `
          <div class="search-row">
            <input class="input" id="requestSearchInput" type="text" placeholder="РџРѕРёСЃРє РїРѕ ID, Telegram ID, username, СЃС‚Р°С‚СѓСЃСѓ, РЅР°РїСЂР°РІР»РµРЅРёСЋ" value="${escapeHtml(state.requestSearch)}" />
            <button class="btn" id="clearRequestSearchBtn" type="button">РћС‡РёСЃС‚РёС‚СЊ</button>
          </div>
          <div class="chips" id="statusChips"></div>
        `;

        const chipsEl = document.getElementById("statusChips");
        ["all", ...REQUEST_STATUSES].forEach((status) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `chip${state.requestStatusFilter === status ? " active" : ""}`;
          const count = counters[status] || 0;
          btn.textContent = `${STATUS_LABELS[status] || status}: ${count}`;
          btn.addEventListener("click", () => {
            state.requestStatusFilter = status;
            renderRequestsView();
          });
          chipsEl.appendChild(btn);
        });

        document.getElementById("requestSearchInput").addEventListener("input", (event) => {
          state.requestSearch = String(event.target.value || "").trim().toLowerCase();
          renderRequestsView();
        });

        document.getElementById("clearRequestSearchBtn").addEventListener("click", () => {
          state.requestSearch = "";
          renderRequestsView();
        });
      }

      function getFilteredRequests() {
        const search = state.requestSearch;
        return state.requests.filter((item) => {
          const byStatus =
            state.requestStatusFilter === "all" || String(item.status || "") === state.requestStatusFilter;
          if (!byStatus) {
            return false;
          }
          if (!search) {
            return true;
          }
          const tokens = [
            item.id,
            item.telegram_id,
            item.username,
            item.full_name,
            item.direction,
            item.status,
            item.status_comment,
          ]
            .map((v) => String(v || "").toLowerCase())
            .join(" ");
          return tokens.includes(search);
        });
      }

      function renderRequestsTable(items) {
        if (!items.length) {
          tableWrap.innerHTML = "<div class='status'>РќРµС‚ Р·Р°СЏРІРѕРє РїРѕРґ С‚РµРєСѓС‰РёР№ С„РёР»СЊС‚СЂ.</div>";
          return;
        }

        const headers = [
          "Р—Р°СЏРІРєР°",
          "РџРѕР»СЊР·РѕРІР°С‚РµР»СЊ",
          "РќР°РїСЂР°РІР»РµРЅРёРµ",
          "РЎСѓРјРјР° РѕС‚РїСЂР°РІРєРё",
          "РЎСѓРјРјР° РїРѕР»СѓС‡РµРЅРёСЏ",
          "РљСѓСЂСЃ",
          "РЎС‚Р°С‚СѓСЃ",
          "РћР±РЅРѕРІР»РµРЅРѕ",
        ];

        const thead = `<thead><tr>${headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>`;
        const tbody = `<tbody>${items
          .map((r) => {
            const isSelected = Number(r.id) === Number(state.selectedRequestId);
            const rowClass = `request-row${isSelected ? " selected" : ""}`;
            return `<tr class="${rowClass}" data-request-id="${escapeHtml(r.id)}">
              <td>#${escapeHtml(r.id)}</td>
              <td>${escapeHtml(normalizeUsername(r.username))}<br><span class="muted">${escapeHtml(r.telegram_id || "-")}</span></td>
              <td>${escapeHtml(r.direction || "-")}</td>
              <td>${escapeHtml(formatAmount(r.amount_send, 2))}</td>
              <td>${escapeHtml(formatAmount(r.amount_receive, 2))}</td>
              <td>${escapeHtml(formatAmount(r.final_rate, 2))}</td>
              <td><span class="status-pill">${escapeHtml(STATUS_LABELS[r.status] || r.status || "-")}</span></td>
              <td>${escapeHtml(formatDate(r.updated_at || r.created_at))}</td>
            </tr>`;
          })
          .join("")}</tbody>`;

        tableWrap.innerHTML = `<table>${thead}${tbody}</table>`;

        tableWrap.querySelectorAll("tr[data-request-id]").forEach((rowEl) => {
          rowEl.addEventListener("click", () => {
            const requestId = Number(rowEl.getAttribute("data-request-id") || "");
            if (!Number.isInteger(requestId) || requestId <= 0) {
              return;
            }
            state.selectedRequestId = requestId;
            renderRequestsView();
          });
        });
      }

      function renderRequestEditor() {
        if (state.view !== "requests") {
          requestEditorWrap.classList.add("hidden");
          return;
        }
        const selected = state.requests.find((item) => Number(item.id) === Number(state.selectedRequestId));
        if (!selected) {
          requestEditorWrap.classList.add("hidden");
          return;
        }
        requestEditorWrap.classList.remove("hidden");
        editorHead.textContent = `Р—Р°СЏРІРєР° #${selected.id} вЂў ${selected.direction} вЂў ${normalizeUsername(selected.username)}`;
        editorStatus.value = REQUEST_STATUSES.includes(String(selected.status)) ? String(selected.status) : "new";
        editorComment.value = selected.status_comment || "";
      }

      function renderRequestsView() {
        setView("requests");
        renderRequestTools(state.requests);
        const filtered = getFilteredRequests();

        if (
          state.selectedRequestId &&
          !filtered.some((item) => Number(item.id) === Number(state.selectedRequestId))
        ) {
          state.selectedRequestId = null;
        }

        renderRequestsTable(filtered);
        renderRequestEditor();
        setStatus(`Р—Р°СЏРІРѕРє: ${filtered.length} (РёР· ${state.requests.length}).`);
      }

      function renderUsersView(items) {
        setView("users");
        contextToolsEl.innerHTML = "";
        const rows = items.map((u) => [
          u.telegram_id,
          normalizeUsername(u.username),
          u.full_name || "-",
          u.phone || "-",
          u.requests_count,
          formatDate(u.created_at),
        ]);
        renderTable(["Telegram ID", "Username", "Р¤РРћ", "РўРµР»РµС„РѕРЅ", "Р—Р°СЏРІРѕРє", "РЎРѕР·РґР°РЅ"], rows);
        setStatus(`РџРѕР»СЊР·РѕРІР°С‚РµР»РµР№: ${rows.length}.`);
      }

      function renderHistoryView(items) {
        setView("history");
        contextToolsEl.innerHTML = "";
        const rows = items.map((h) => [
          STATUS_LABELS[h.status] || h.status,
          h.comment || "-",
          h.changed_by || "-",
          h.direction || "-",
          normalizeUsername(h.username),
          h.telegram_id || "-",
          formatDate(h.created_at),
        ]);
        renderTable(["РЎС‚Р°С‚СѓСЃ", "РљРѕРјРјРµРЅС‚Р°СЂРёР№", "РљРµРј РёР·РјРµРЅРµРЅРѕ", "РќР°РїСЂР°РІР»РµРЅРёРµ", "Username", "Telegram ID", "РљРѕРіРґР°"], rows);
        setStatus(`РЎРѕР±С‹С‚РёР№ РІ РёСЃС‚РѕСЂРёРё: ${rows.length}.`);
      }

      function renderSettingsView(settingsData) {
        setView("settings");
        const minDealOptions = (settingsData.allowed_min_deal_rub || [])
          .map((value) => {
            const selected = Number(value) === Number(settingsData.min_deal_rub) ? " selected" : "";
            return `<option value="${escapeHtml(value)}"${selected}>${escapeHtml(value)} RUB</option>`;
          })
          .join("");
        const roundStepOptions = (settingsData.allowed_round_step_rub || [])
          .map((value) => {
            const selected = Number(value) === Number(settingsData.round_step_rub) ? " selected" : "";
            return `<option value="${escapeHtml(value)}"${selected}>${escapeHtml(value)} RUB</option>`;
          })
          .join("");
        contextToolsEl.innerHTML = `
          <div class="panel" style="margin-top:0">
            <div class="editor-head">РќР°СЃС‚СЂРѕР№РєРё РѕРїРµСЂР°С‚РѕСЂР°</div>
            <label class="label" for="settingsMinDealRub">Min deal (RUB)</label>
            <select class="select" id="settingsMinDealRub">${minDealOptions}</select>
            <label class="label" for="settingsRoundStepRub">РЁР°Рі Р°РІС‚РѕРѕРєСЂСѓРіР»РµРЅРёСЏ RUB</label>
            <select class="select" id="settingsRoundStepRub">${roundStepOptions}</select>
            <div class="buttons">
              <button class="btn primary" id="saveSettingsBtn" type="button">РЎРѕС…СЂР°РЅРёС‚СЊ</button>
            </div>
            <p class="hint">Р’С‹Р±РµСЂРёС‚Рµ РјРёРЅРёРјР°Р»СЊРЅСѓСЋ СЃРґРµР»РєСѓ Рё С€Р°Рі РѕРєСЂСѓРіР»РµРЅРёСЏ РґР»СЏ СЂСѓР±Р»РµРІРѕР№ СЃС‚РѕСЂРѕРЅС‹.</p>
          </div>
        `;
        document.getElementById("saveSettingsBtn").addEventListener("click", () => {
          saveSettings().catch((e) => setStatus(`РћС€РёР±РєР° СЃРѕС…СЂР°РЅРµРЅРёСЏ РЅР°СЃС‚СЂРѕРµРє: ${e.message}`, true));
        });
        const minDealLabelEl = contextToolsEl.querySelector('label[for="settingsMinDealRub"]');
        if (minDealLabelEl) {
          minDealLabelEl.textContent = "\u041c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u0430\u044f \u0441\u0434\u0435\u043b\u043a\u0430 (RUB)";
        }
        setStatus(
          `РўРµРєСѓС‰РёРµ РЅР°СЃС‚СЂРѕР№РєРё: РјРёРЅРёРјСѓРј ${settingsData.min_deal_rub} RUB, РѕРєСЂСѓРіР»РµРЅРёРµ ${settingsData.round_step_rub} RUB.`
        );
      }

      function renderAdminChatUsers() {
        if (!state.chatUsers.length) {
          adminChatUsersList.innerHTML = "<div class='muted'>РџРѕРєР° РЅРµС‚ РґРёР°Р»РѕРіРѕРІ.</div>";
          return;
        }
        adminChatUsersList.innerHTML = state.chatUsers
          .map((user) => {
            const selected = Number(state.selectedChatUserId) === Number(user.telegram_id);
            const unread = Number(user.unread_count || 0);
            const unreadBadge = unread > 0 ? ` вЂў РЅРѕРІС‹С…: ${unread}` : "";
            return `
              <button class="chat-user-btn${selected ? " active" : ""}" type="button" data-chat-user-id="${escapeHtml(user.telegram_id)}">
                <div>${escapeHtml(normalizeUsername(user.username))}</div>
                <div class="chat-user-meta">${escapeHtml(user.full_name || "-")} вЂў id:${escapeHtml(user.telegram_id)}</div>
                <div class="chat-user-meta">${escapeHtml(user.last_message || "Р‘РµР· СЃРѕРѕР±С‰РµРЅРёР№")}${escapeHtml(unreadBadge)}</div>
              </button>
            `;
          })
          .join("");
        adminChatUsersList.querySelectorAll("[data-chat-user-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const telegramId = Number(btn.getAttribute("data-chat-user-id") || "");
            if (!Number.isInteger(telegramId) || telegramId <= 0) {
              return;
            }
            state.selectedChatUserId = telegramId;
            loadAdminChatConversation(telegramId, false).catch((e) =>
              setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РїРµСЂРµРїРёСЃРєРё: ${e.message}`, true)
            );
          });
        });
      }

      function renderAdminChatMessages() {
        if (!state.chatMessages.length) {
          adminChatMessages.innerHTML = "<div class='muted'>РЎРѕРѕР±С‰РµРЅРёР№ РїРѕРєР° РЅРµС‚.</div>";
          return;
        }
        adminChatMessages.innerHTML = state.chatMessages
          .map((item) => {
            const mine = item.sender_role === "operator";
            return `
              <div class="chat-msg-row${mine ? " mine" : ""}">
                <div class="chat-msg">
                  <div class="chat-msg-text">${escapeHtml(item.message || "")}</div>
                  <div class="chat-msg-time">${escapeHtml(formatChatDate(item.created_at))}</div>
                </div>
              </div>
            `;
          })
          .join("");
        adminChatMessages.scrollTop = adminChatMessages.scrollHeight;
      }

      function stopAdminChatPolling() {
        if (state.chatPollTimer) {
          clearInterval(state.chatPollTimer);
          state.chatPollTimer = null;
        }
      }

      function startAdminChatPolling() {
        stopAdminChatPolling();
        state.chatPollTimer = setInterval(() => {
          if (state.view !== "chat") {
            return;
          }
          loadAdminChatUsers(true).catch(() => {
            // silent polling
          });
          if (state.selectedChatUserId) {
            loadAdminChatConversation(state.selectedChatUserId, true).catch(() => {
              // silent polling
            });
          }
        }, 5000);
      }

      async function loadAdminChatUsers(silent = false) {
        if (!state.accessGranted) {
          return;
        }
        if (!silent) {
          setStatus("Р—Р°РіСЂСѓР·РєР° РґРёР°Р»РѕРіРѕРІ...");
        }
        const data = await api(`/api/admin/chat/users/${state.telegramId}?limit=150`);
        state.chatUsers = data.items || [];
        if (
          state.selectedChatUserId &&
          !state.chatUsers.some((item) => Number(item.telegram_id) === Number(state.selectedChatUserId))
        ) {
          state.selectedChatUserId = null;
        }
        if (!state.selectedChatUserId && state.chatUsers.length) {
          const unreadFirst = state.chatUsers.find((item) => Number(item.unread_count || 0) > 0);
          state.selectedChatUserId = unreadFirst
            ? Number(unreadFirst.telegram_id)
            : Number(state.chatUsers[0].telegram_id);
        }
        renderAdminChatUsers();
      }

      async function loadAdminChatConversation(targetTelegramId, silent = false) {
        if (!targetTelegramId) {
          return;
        }
        const data = await api(`/api/admin/chat/${state.telegramId}/${targetTelegramId}?limit=250`);
        state.chatMessages = data.items || [];
        adminChatTitle.textContent = `Р§Р°С‚ СЃ ${normalizeUsername(data.username)} вЂў id:${data.user_telegram_id}`;
        renderAdminChatMessages();
        if (!silent) {
          setStatus(`РћС‚РєСЂС‹С‚ С‡Р°С‚ СЃ РїРѕР»СЊР·РѕРІР°С‚РµР»РµРј ${data.user_telegram_id}.`);
        }
      }

      async function sendAdminChatMessage() {
        const targetTelegramId = Number(state.selectedChatUserId || 0);
        if (!targetTelegramId) {
          setStatus("РЎРЅР°С‡Р°Р»Р° РІС‹Р±РµСЂРёС‚Рµ РґРёР°Р»РѕРі СЃР»РµРІР°.", true);
          return;
        }
        const message = String(adminChatInput.value || "").trim();
        if (!message) {
          return;
        }
        adminChatSendBtn.disabled = true;
        try {
          await api(`/api/admin/chat/${state.telegramId}/${targetTelegramId}`, {
            method: "POST",
            body: JSON.stringify({ message }),
          });
          adminChatInput.value = "";
          await loadAdminChatConversation(targetTelegramId, true);
          await loadAdminChatUsers(true);
        } finally {
          adminChatSendBtn.disabled = false;
        }
      }

      async function loadChatView() {
        setView("chat");
        await loadAdminChatUsers(false);
        if (state.selectedChatUserId) {
          await loadAdminChatConversation(state.selectedChatUserId, false);
        } else {
          adminChatTitle.textContent = "Р’С‹Р±РµСЂРёС‚Рµ РїРѕР»СЊР·РѕРІР°С‚РµР»СЏ СЃР»РµРІР°";
          adminChatMessages.innerHTML = "<div class='muted'>РќРµС‚ СЃРѕРѕР±С‰РµРЅРёР№.</div>";
        }
        startAdminChatPolling();
      }

      async function loadUsers() {
        if (!state.accessGranted) {
          return;
        }
        setStatus("Р—Р°РіСЂСѓР·РєР° РїРѕР»СЊР·РѕРІР°С‚РµР»РµР№...");
        const data = await api(`/api/admin/users/${state.telegramId}`);
        renderUsersView(data.items || []);
      }

      async function loadRequests() {
        if (!state.accessGranted) {
          return;
        }
        setStatus("Р—Р°РіСЂСѓР·РєР° Р·Р°СЏРІРѕРє...");
        const data = await api(`/api/admin/requests/${state.telegramId}`);
        state.requests = data.items || [];
        renderRequestsView();
      }

      async function loadHistory() {
        if (!state.accessGranted) {
          return;
        }
        setStatus("Р—Р°РіСЂСѓР·РєР° РёСЃС‚РѕСЂРёРё СЃС‚Р°С‚СѓСЃРѕРІ...");
        const data = await api(`/api/admin/request-history/${state.telegramId}`);
        renderHistoryView(data.items || []);
      }

      async function loadSettings() {
        if (!state.accessGranted) {
          return;
        }
        setStatus("Р—Р°РіСЂСѓР·РєР° РЅР°СЃС‚СЂРѕРµРє...");
        const data = await api(`/api/admin/settings/${state.telegramId}`);
        state.appSettings = data;
        renderSettingsView(data);
      }

      async function saveSettings() {
        if (!state.accessGranted) {
          return;
        }
        const minDealSelect = document.getElementById("settingsMinDealRub");
        const roundStepSelect = document.getElementById("settingsRoundStepRub");
        if (!minDealSelect || !roundStepSelect) {
          return;
        }
        const minDealRub = Number(minDealSelect.value);
        const roundStepRub = Number(roundStepSelect.value);
        if (!Number.isFinite(minDealRub)) {
          setStatus("РќРµРєРѕСЂСЂРµРєС‚РЅРѕРµ Р·РЅР°С‡РµРЅРёРµ РјРёРЅРёРјР°Р»СЊРЅРѕР№ СЃРґРµР»РєРё.", true);
          return;
        }
        if (!Number.isFinite(roundStepRub)) {
          setStatus("РќРµРєРѕСЂСЂРµРєС‚РЅРѕРµ Р·РЅР°С‡РµРЅРёРµ С€Р°РіР° РѕРєСЂСѓРіР»РµРЅРёСЏ.", true);
          return;
        }
        setStatus("РЎРѕС…СЂР°РЅСЏСЋ РЅР°СЃС‚СЂРѕР№РєРё...");
        const data = await api(`/api/admin/settings/${state.telegramId}`, {
          method: "PATCH",
          body: JSON.stringify({
            min_deal_rub: minDealRub,
            round_step_rub: roundStepRub,
          }),
        });
        state.appSettings = data;
        renderSettingsView(data);
      }

      async function applySelectedRequestStatus() {
        if (!state.accessGranted) {
          setStatus("Р”РѕСЃС‚СѓРї РЅРµ РїСЂРµРґРѕСЃС‚Р°РІР»РµРЅ.", true);
          return;
        }
        const selected = state.requests.find((item) => Number(item.id) === Number(state.selectedRequestId));
        if (!selected) {
          setStatus("РЎРЅР°С‡Р°Р»Р° РІС‹Р±РµСЂРёС‚Рµ Р·Р°СЏРІРєСѓ РІ С‚Р°Р±Р»РёС†Рµ.", true);
          return;
        }
        const newStatus = editorStatus.value;
        const comment = String(editorComment.value || "").trim();

        setStatus(`РћР±РЅРѕРІР»СЏСЋ СЃС‚Р°С‚СѓСЃ Р·Р°СЏРІРєРё #${selected.id}...`);
        await api(`/api/admin/requests/${state.telegramId}/${selected.id}/status`, {
          method: "PATCH",
          body: JSON.stringify({
            status: newStatus,
            comment: comment || null,
          }),
        });

        setStatus(`Р—Р°СЏРІРєР° #${selected.id}: СЃС‚Р°С‚СѓСЃ РѕР±РЅРѕРІР»РµРЅ.`);
        await loadRequests();
      }

      async function deleteSelectedRequest() {
        if (!state.accessGranted) {
          setStatus("Р”РѕСЃС‚СѓРї РЅРµ РїСЂРµРґРѕСЃС‚Р°РІР»РµРЅ.", true);
          return;
        }
        const selected = state.requests.find((item) => Number(item.id) === Number(state.selectedRequestId));
        if (!selected) {
          setStatus("РЎРЅР°С‡Р°Р»Р° РІС‹Р±РµСЂРёС‚Рµ Р·Р°СЏРІРєСѓ РІ С‚Р°Р±Р»РёС†Рµ.", true);
          return;
        }
        const confirmed = window.confirm(`РЈРґР°Р»РёС‚СЊ Р·Р°СЏРІРєСѓ #${selected.id}? Р­С‚Рѕ РґРµР№СЃС‚РІРёРµ РЅРµРѕР±СЂР°С‚РёРјРѕ.`);
        if (!confirmed) {
          return;
        }
        setStatus(`РЈРґР°Р»СЏСЋ Р·Р°СЏРІРєСѓ #${selected.id}...`);
        await api(`/api/admin/requests/${state.telegramId}/${selected.id}`, {
          method: "DELETE",
        });
        state.selectedRequestId = null;
        setStatus(`Р—Р°СЏРІРєР° #${selected.id} СѓРґР°Р»РµРЅР°.`);
        await loadRequests();
      }

      document.getElementById("loadUsersBtn").addEventListener("click", () => {
        loadUsers().catch((e) => setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РїРѕР»СЊР·РѕРІР°С‚РµР»РµР№: ${e.message}`, true));
      });
      document.getElementById("loadRequestsBtn").addEventListener("click", () => {
        loadRequests().catch((e) => setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё Р·Р°СЏРІРѕРє: ${e.message}`, true));
      });
      document.getElementById("loadHistoryBtn").addEventListener("click", () => {
        loadHistory().catch((e) => setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РёСЃС‚РѕСЂРёРё: ${e.message}`, true));
      });
      document.getElementById("loadChatBtn").addEventListener("click", () => {
        loadChatView().catch((e) => setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё С‡Р°С‚Р°: ${e.message}`, true));
      });
      document.getElementById("loadSettingsBtn").addEventListener("click", () => {
        loadSettings().catch((e) => setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё РЅР°СЃС‚СЂРѕРµРє: ${e.message}`, true));
      });
      document.getElementById("applyStatusBtn").addEventListener("click", () => {
        applySelectedRequestStatus().catch((e) => setStatus(`РћС€РёР±РєР° СЃРјРµРЅС‹ СЃС‚Р°С‚СѓСЃР°: ${e.message}`, true));
      });
      document.getElementById("deleteRequestBtn").addEventListener("click", () => {
        deleteSelectedRequest().catch((e) => setStatus(`РћС€РёР±РєР° СѓРґР°Р»РµРЅРёСЏ Р·Р°СЏРІРєРё: ${e.message}`, true));
      });
      adminChatSendBtn.addEventListener("click", () => {
        sendAdminChatMessage().catch((e) => setStatus(`РћС€РёР±РєР° РѕС‚РїСЂР°РІРєРё СЃРѕРѕР±С‰РµРЅРёСЏ: ${e.message}`, true));
      });
      adminChatInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") {
          return;
        }
        event.preventDefault();
        sendAdminChatMessage().catch((e) => setStatus(`РћС€РёР±РєР° РѕС‚РїСЂР°РІРєРё СЃРѕРѕР±С‰РµРЅРёСЏ: ${e.message}`, true));
      });
      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "/";
      });

      localizeAdminStaticTexts();

      checkAccess().then(() => {
        if (state.accessGranted) {
          loadRequests().catch((e) => setStatus(`РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё Р·Р°СЏРІРѕРє: ${e.message}`, true));
        }
      });
    </script>
  </body>
</html>
