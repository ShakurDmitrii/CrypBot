databases:
  - name: nebo-db
    plan: free
    databaseName: nebo
    user: nebo

services:
  - type: web
    name: nebo-miniapp
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && uvicorn src.miniapp.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nebo-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: BOT_OPERATOR_CHAT_ID
        sync: false
      - key: BOT_OPERATOR_IDS
        sync: false
      - key: BOT_OPERATOR_USERNAME
        sync: false
      - key: BOT_OFFER_URL
        value: https://example.com/offer
      - key: BOT_MARGIN_PERCENT
        value: "1.5"
      - key: BOT_PROXY
        value: ""
      - key: RATE_API_BASE_URL
        value: https://api.rapira.net
      - key: RATE_API_TIMEOUT_SEC
        value: "10"
      - key: RATE_CACHE_TTL_SEC
        value: "15"
      - key: RATE_USDT_RUB_SYMBOL
        value: USDT/RUB
      - key: BOT_MINI_APP_URL
        sync: false

  - type: worker
    name: nebo-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && python -m src.main"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nebo-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: BOT_OPERATOR_CHAT_ID
        sync: false
      - key: BOT_OPERATOR_IDS
        sync: false
      - key: BOT_OPERATOR_USERNAME
        sync: false
      - key: BOT_OFFER_URL
        value: https://example.com/offer
      - key: BOT_MARGIN_PERCENT
        value: "1.5"
      - key: BOT_PROXY
        value: ""
      - key: RATE_API_BASE_URL
        value: https://api.rapira.net
      - key: RATE_API_TIMEOUT_SEC
        value: "10"
      - key: RATE_CACHE_TTL_SEC
        value: "15"
      - key: RATE_USDT_RUB_SYMBOL
        value: USDT/RUB
      - key: BOT_MINI_APP_URL
        sync: false
